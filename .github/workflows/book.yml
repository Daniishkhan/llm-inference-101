# book.yml: checks the book, and publishes it to GitHub Pages when the check passes on main.
#
# 1. check:  runs every Python example in the book, compares it with its printed output, checks
#            every link, and refuses any example that defines a contract or drill function
#            (locally: uv run python tools/book-check.py).
# 2. site:   on main only, builds the static copy with tools/build-pages.py.
# 3. deploy: publishes it to https://daniishkhan.github.io/llm-inference-101/.
#
# The online copy and the local one are the same pages: neither has a live tutor. The tutor panel
# composes a prompt for you to paste into Claude Code.
name: book

on:
  push:
    paths:
      - "docs/book/**"
      - "pyproject.toml"
      - "tools/book-check.py"
      - "tools/build-pages.py"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - "tools/book-check.py"
      - "tools/build-pages.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run, except on main, where a deployment is never cut off half-way.
concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Book examples run and match their output
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no moving major tag is published: pin the release
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python tools/book-check.py

  site:
    name: Build the static site
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/build-pages.py build-pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-pages

  deploy:
    name: Publish to GitHub Pages
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
